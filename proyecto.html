<style>
  :root{--bg:#0B1114;--card:#141C21;--ink:#F1EEE7;--soft:#C9D0D6;--mut:#8B99A3;
        --rust:#E09A6E;--line:#2A343C;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
       font-family:"Spline Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:22px;}
  .caja{width:100%;max-width:390px;text-align:center;}
  .marca{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:2.1rem;
         letter-spacing:-.02em;line-height:1;margin-bottom:4px;}
  .marca span{color:var(--rust);}
  .lema{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.2em;
        color:#EFC077;display:inline-block;transform:rotate(-6deg);
        border-bottom:1px solid rgba(239,192,119,.55);padding:0 2px 2px;margin-bottom:26px;}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.15rem;
     line-height:1.35;margin:0 0 8px;}
  p{font-size:.9rem;color:var(--soft);line-height:1.5;margin:0 0 20px;}
  label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;
        letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
        text-align:left;margin-bottom:6px;}
  input{width:100%;font:inherit;font-size:1.05rem;letter-spacing:.06em;
        padding:13px 14px;border-radius:9px;border:1px solid var(--line);
        background:var(--card);color:var(--ink);text-align:center;}
  input:focus{outline:0;border-color:var(--rust);}
  button{width:100%;margin-top:11px;font:inherit;font-size:.95rem;font-weight:600;
         padding:13px;border:0;border-radius:9px;background:var(--rust);
         color:#12171A;cursor:pointer;min-height:48px;}
  button:disabled{opacity:.55;cursor:default;}
  .err{min-height:20px;margin-top:11px;font-size:.85rem;color:#E08C84;}
  .pie{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
       font-size:.78rem;color:var(--mut);line-height:1.5;}
  .cargando{display:none;margin-top:14px;font-family:"IBM Plex Mono",monospace;
            font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust);}
  .cargando.on{display:block;}
</style>

<script>
(function(){
"use strict";
var VUELTAS = 200000;
var f=document.getElementById('f'), cod=document.getElementById('cod'),
    err=document.getElementById('err'), ok=document.getElementById('ok'),
    cg=document.getElementById('cg');

function bytes(b64){
  var bin=atob(b64), n=bin.length, a=new Uint8Array(n);
  for(var i=0;i<n;i++) a[i]=bin.charCodeAt(i);
  return a;
}
async function descomprime(a){
  if(typeof DecompressionStream==='undefined') throw new Error('viejo');
  var ds=new DecompressionStream('gzip');
  var r=new Blob([a]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(r).arrayBuffer());
}
async function abre(codigo){
  var todo=bytes(document.getElementById('carga').textContent.trim());
  var sal=todo.slice(0,16), iv=todo.slice(16,28), cif=todo.slice(28);
  var base=await crypto.subtle.importKey('raw',
      new TextEncoder().encode(codigo.trim().toLowerCase()),
      'PBKDF2', false, ['deriveKey']);
  var clave=await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:sal, iterations:VUELTAS, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var claro=await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, clave, cif);
  var html=new TextDecoder('utf-8').decode(await descomprime(new Uint8Array(claro)));
  document.open(); document.write(html); document.close();
}
f.addEventListener('submit', function(e){
  e.preventDefault();
  var c=cod.value||'';
  if(!c.trim()){ err.textContent='Escribe el c\u00f3digo.'; return; }
  if(!(window.crypto && crypto.subtle)){
    err.textContent='Este navegador no puede abrirla. Prueba con Chrome o Safari actualizado.';
    return;
  }
  err.textContent=''; ok.disabled=true; cg.classList.add('on');
  try{ window.__vigila && window.__vigila(); }catch(ex){}
  setTimeout(function(){
    abre(c).catch(function(ex){
      ok.disabled=false; cg.classList.remove('on');
      err.textContent = (ex && ex.message==='viejo')
        ? 'Este navegador es demasiado antiguo. Actual\u00edzalo y vuelve a probar.'
        : 'Ese c\u00f3digo no es. Mira que no sobre ning\u00fan espacio.';
      cod.select();
    });
  }, 30);
});
cod.focus();
/* Un numero visible con el tamaño de la version que se ha cargado.
   Si Ivan dice un numero distinto del que acabamos de publicar, es que
   su movil esta abriendo una version vieja guardada en la memoria del
   navegador. Sin esto ibamos a ciegas. */
try{
  var v=document.createElement('div');
  v.style.cssText='margin-top:10px;font-family:monospace;font-size:9px;letter-spacing:.1em;color:#5C6B75;';
  var vz='?';
  try{
    var vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var es=vs.filter(function(x){ return (x.lang||'').toLowerCase().indexOf('es')===0; });
    vz = es.length ? ('voz: s\u00ed ('+es.length+')') : 'VOZ: NO — tu m\u00f3vil no tiene voz en espa\u00f1ol';
  }catch(e){ vz='voz: ?'; }
  v.textContent='v'+Math.round(document.getElementById('carga').textContent.trim().length/1024)+'  \u00b7  '+vz;
  document.querySelector('.pie').appendChild(v);
  try{ speechSynthesis.addEventListener('voiceschanged', function(){
    var vs=speechSynthesis.getVoices()||[];
    var es=vs.filter(function(x){ return (x.lang||'').toLowerCase().indexOf('es')===0; });
    v.textContent='v'+Math.round(document.getElementById('carga').textContent.trim().length/1024)+
      '  \u00b7  '+(es.length?('voz: s\u00ed ('+es.length+')'):'VOZ: NO — tu m\u00f3vil no tiene voz en espa\u00f1ol');
  }); }catch(e){}
}catch(e){}

/* Si tarda demasiado, decirlo en vez de dejar «Abriendo...» para siempre */
window.__vigila=function(){
  setTimeout(function(){
    if(cg.classList.contains('on')){
      err.innerHTML='Est\u00e1 tardando demasiado. <b>Cierra la pesta\u00f1a y vuelve a entrar '+
                    'con un n\u00famero distinto al final</b> (por ejemplo ?99).';
    }
  }, 25000);
};
})();
</script>
