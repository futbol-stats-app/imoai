<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="IMMO IA" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Dibujado aquí, a mano, el 18/09/2026 para LA IDA Y VUELTA.
       Un cuadrado con los colores de la casa y las letras IMMO IA.
       No copia ningún logotipo de nadie: son dos rectángulos y texto. -->
  <rect width="512" height="512" rx="96" fill="#13342A"/>
  <!-- el marco va metido hacia dentro a propósito: en Android la aplicación
       recorta el dibujo en redondo y así no se come el borde -->
  <rect x="72" y="72" width="368" height="368" rx="56" fill="none" stroke="#D4A017" stroke-width="12"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="256" y="252" font-size="104" fill="#FFFFFF" letter-spacing="4">IMMO</text>
    <text x="256" y="376" font-size="104" fill="#D4A017" letter-spacing="14">IA</text>
  </g>
</svg>
