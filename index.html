<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ImoAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="preload" href="app.dat" as="fetch" crossorigin="anonymous">
<style>
  :root{--bg:#0B1114;--card:#141C21;--ink:#F1EEE7;--soft:#C9D0D6;--mut:#8B99A3;
        --rust:#E09A6E;--line:#2A343C;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
       font-family:"Spline Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:22px;}
  .caja{width:100%;max-width:390px;text-align:center;}
  .marca{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:2.1rem;
         letter-spacing:-.02em;line-height:1;margin-bottom:4px;}
  .marca span{color:var(--rust);}
  .lema{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.2em;
        color:#EFC077;display:inline-block;transform:rotate(-6deg);
        border-bottom:1px solid rgba(239,192,119,.55);padding:0 2px 2px;margin-bottom:26px;}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.24rem;
     line-height:1.35;margin:0 0 8px;}
  p{font-size:1rem;color:var(--soft);line-height:1.55;margin:0 0 20px;}
  label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;
        letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
        text-align:left;margin-bottom:6px;}
  input{width:100%;font:inherit;font-size:1.05rem;letter-spacing:.06em;
        padding:14px;border-radius:9px;border:1px solid var(--line);
        background:var(--card);color:var(--ink);text-align:center;min-height:48px;}
  input:focus{outline:0;border-color:var(--rust);}
  button{width:100%;margin-top:11px;font:inherit;font-size:1rem;font-weight:600;
         padding:14px;border:0;border-radius:9px;background:var(--rust);
         color:#12171A;cursor:pointer;min-height:48px;}
  button:disabled{opacity:.55;cursor:default;}
  .err{min-height:20px;margin-top:11px;font-size:.92rem;color:#E08C84;}
  .pie{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
       font-size:.85rem;color:var(--mut);line-height:1.55;}
  .cargando{min-height:16px;margin-top:12px;font-family:"IBM Plex Mono",monospace;
            font-size:10px;letter-spacing:.12em;text-transform:uppercase;
            color:var(--mut);transition:color .2s linear;}
  .cargando.on{color:var(--rust);}
  .barra{height:2px;margin-top:8px;border-radius:2px;background:var(--line);
         overflow:hidden;opacity:0;transition:opacity .25s linear;}
  .barra.on{opacity:1;}
  .barra i{display:block;height:100%;width:0;background:var(--rust);
           transition:width .2s linear;}
</style>

<div class="caja">
  <div class="marca">Imo<span>AI</span></div>
  <div class="lema">all house</div>
  <h1>Esta demostraci&oacute;n es privada</h1>
  <p>Escribe el c&oacute;digo que te hemos dado. Si no lo tienes, p&iacute;denoslo.</p>
  <form id="f" autocomplete="off">
    <label for="cod">C&oacute;digo de entrada</label>
    <input id="cod" name="cod" type="password" autocomplete="off"
           autocapitalize="none" autocorrect="off" spellcheck="false"
           enterkeyhint="go" aria-describedby="err">
    <button type="submit" id="ok">Entrar</button>
  </form>
  <div class="err" id="err" role="status" aria-live="polite"></div>
  <div class="cargando" id="cg" role="status" aria-live="polite"></div>
  <div class="barra" id="ba"><i id="bi"></i></div>
  <div class="pie">Demo de ImoAI &middot; datos reales, tr&aacute;mites simulados.<br>
    Ninguna gesti&oacute;n de esta demostraci&oacute;n es real.</div>
</div>

<script>
(function(){
"use strict";
/* La carga se empieza a bajar EN CUANTO SE ABRE LA PAGINA, mientras la persona
   lee y escribe el codigo. Cuando le da a Entrar, casi siempre ya esta. */
var _p = null;
function CARGA(){
  if(!_p) _p = baja();
  return _p;
}
async function baja(){
  var r;
  try { r = await fetch('app.dat', {cache:'force-cache'}); }
  catch(e){ throw new Error('red'); }
  if(!r.ok) throw new Error('red');
  var total = +(r.headers.get('content-length') || 0);
  if(!r.body || !total){ return new Uint8Array(await r.arrayBuffer()); }
  var lector = r.body.getReader(), trozos = [], leido = 0;
  ba.classList.add('on');
  for(;;){
    var t = await lector.read();
    if(t.done) break;
    trozos.push(t.value); leido += t.value.length;
    var pc = Math.min(100, Math.round(leido*100/total));
    bi.style.width = pc + '%';
    if(!ok.disabled) cg.textContent = 'Preparando\u2026 ' + pc + ' %';
  }
  ba.classList.remove('on');
  if(!ok.disabled) cg.textContent = 'Lista';
  var a = new Uint8Array(leido), i = 0;
  trozos.forEach(function(t){ a.set(t, i); i += t.length; });
  return a;
}
/* en marcha desde el primer momento, sin esperar a nadie */
CARGA().catch(function(){ /* si falla, se vuelve a intentar al pulsar Entrar */ _p = null; });

var VUELTAS = 200000;
var f=document.getElementById('f'), cod=document.getElementById('cod'),
    err=document.getElementById('err'), ok=document.getElementById('ok'),
    cg=document.getElementById('cg'), ba=document.getElementById('ba'),
    bi=document.getElementById('bi');

async function descomprime(a){
  if(typeof DecompressionStream==='undefined') throw new Error('viejo');
  var ds=new DecompressionStream('gzip');
  var r=new Blob([a]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(r).arrayBuffer());
}
async function abre(codigo){
  var todo=await CARGA();
  var sal=todo.slice(0,16), iv=todo.slice(16,28), cif=todo.slice(28);
  var base=await crypto.subtle.importKey('raw',
      new TextEncoder().encode(codigo.trim().toLowerCase()),
      'PBKDF2', false, ['deriveKey']);
  var clave=await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:sal, iterations:VUELTAS, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var claro=await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, clave, cif);
  var html=new TextDecoder('utf-8').decode(await descomprime(new Uint8Array(claro)));
  document.open(); document.write(html); document.close();
}
f.addEventListener('submit', function(e){
  e.preventDefault();
  var c=cod.value||'';
  if(!c.trim()){ err.textContent='Escribe el c\u00f3digo.'; return; }
  if(!(window.crypto && crypto.subtle)){
    err.textContent='Este navegador no puede abrirla. Prueba con Chrome o Safari actualizado.';
    return;
  }
  err.textContent=''; ok.disabled=true;
  cg.classList.add('on'); cg.textContent='Abriendo\u2026';
  setTimeout(function(){
    abre(c).catch(function(ex){
      ok.disabled=false; cg.classList.remove('on'); cg.textContent='';
      ba.classList.remove('on');
      err.textContent = (ex && ex.message==='viejo')
        ? 'Este navegador es demasiado antiguo. Actual\u00edzalo y vuelve a probar.'
        : (ex && ex.message==='red')
        ? 'No se ha podido descargar. Mira la conexi\u00f3n y vuelve a probar.'
        : 'Ese c\u00f3digo no es. Mira que no sobre ning\u00fan espacio.';
      cod.select();
    });
  }, 30);
});
cod.focus();

})();
</script>
