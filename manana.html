<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tu mañana · IMMO IA</title>
<style>
  :root{
    --marca:#13342A; --tinta:#1B231F; --tinta-2:#635C4B;
    --linea:#D8D1BE; --tarjeta:#fff; --fondo:#FAF8F3;
    --rojo:#8A3B12; --rojo-f:#FBEDE4; --rojo-l:#E3BFA0;
    --verde-f:#EDF1EE; --verde-l:#CBD9D0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .caja{max-width:820px;margin:0 auto;padding:22px 16px 70px}
  a{color:var(--marca)}

  .ma-cab{border-bottom:1px solid var(--linea);padding-bottom:14px;margin-bottom:18px}
  .ma-dia{margin:0 0 4px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-2)}
  .ma-cab h1{margin:0 0 6px;font-size:28px;line-height:1.15;color:var(--marca)}
  .ma-cuenta{margin:0;font-size:14.5px;color:var(--tinta-2)}
  .ma-rojo{color:var(--rojo)}

  .ma-primero{background:var(--rojo-f);border:1px solid var(--rojo-l);border-radius:12px;padding:15px 17px;margin:0 0 22px}
  .ma-primero .ma-et{margin:0 0 5px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--rojo)}
  .ma-primero b{display:block;font-size:18px;line-height:1.3;color:var(--marca)}
  .ma-primero .ma-donde{display:inline-block;margin-top:4px;font-size:13px;color:var(--tinta-2);
    background:#fff;border:1px solid var(--rojo-l);border-radius:999px;padding:2px 10px}
  .ma-primero small{display:block;margin-top:7px;font-size:14px;color:var(--tinta-2)}

  .ma-b{margin:0 0 24px}
  .ma-b h2{font-size:17px;color:var(--marca);margin:0 0 3px}
  .ma-sub{margin:0 0 11px;font-size:13.5px;color:var(--tinta-2)}
  .ma-l{list-style:none;margin:0;padding:0}
  .ma-l li{background:var(--tarjeta);border:1px solid var(--linea);border-radius:11px;padding:12px 14px;margin:0 0 8px}
  .ma-l b{display:block;font-size:15.5px;color:var(--tinta)}
  .ma-l .ma-donde{display:inline-block;margin-top:4px;font-size:12.5px;color:var(--tinta-2);
    background:var(--verde-f);border:1px solid var(--verde-l);border-radius:999px;padding:2px 9px}
  .ma-l small{display:block;margin-top:6px;font-size:13.5px;color:var(--tinta-2)}

  .ma-ir{margin-top:10px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:8px;
    background:#EEE9DE;color:#5B4646;cursor:pointer}
  .ma-ir:hover{filter:brightness(.97)}
  .ma-ir1{background:var(--marca);color:#fff;font-size:14.5px;padding:9px 17px}

  .ma-tar{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .ma-t{background:var(--tarjeta);border:1px solid var(--linea);border-radius:11px;padding:12px 14px}
  .ma-t b{display:block;font-size:15.5px;color:var(--marca)}
  .ma-t .ma-aut{display:block;margin-top:3px;font-size:12.5px;color:var(--tinta-2)}
  .ma-t small{display:block;margin-top:6px;font-size:13px;color:var(--tinta-2)}
  .ma-t .ma-hecho{color:#1B4332}

  .ma-ia{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:14px 16px}
  .ma-ia button{padding:9px 16px;font:inherit;font-weight:600;font-size:14.5px;border:0;border-radius:9px;
    background:var(--marca);color:#fff;cursor:pointer}
  .ma-ia button[disabled]{background:#EEE9DE;color:#8C8373;cursor:default}
  #ma-dice{margin-top:11px;font-size:15px;color:var(--tinta);white-space:pre-wrap}

  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--linea);font-size:13px;color:var(--tinta-2)}
  @media (max-width:520px){ .ma-cab h1{font-size:24px} .caja{padding:18px 14px 60px} .ma-primero b{font-size:16.5px} }
</style>
</head>
<body>
<div class="caja">

  <div id="manana"><p style="color:#635C4B">Abriendo tu mañana…</p></div>

  <div id="cuenta-oficina"></div>
  <div id="cartera"></div>

  <footer>
    El orden lo calcula el motor con los plazos que hay escritos, y sale siempre igual.
    La IA solo lo explica con palabras cuando se lo pides: no decide ella.
    · <a href="inmobiliaria.html">La secretaria</a>
    · <a href="privacidad.html">Privacidad</a>
  </footer>

</div>

<script>
  window.CONFIG = { api: "https://immoia.ley1998ortizz.workers.dev" };
</script>
<script src="nucleo.js?v=3"></script>
<script src="motor.js?v=1"></script>
<script src="oficina.js?v=1"></script>
<script src="cartera.js?v=1"></script>
<script src="inmo.js?v=3"></script>
<script src="manana.js?v=1"></script>
</body>
</html>
